name: Update videos and metrics

on:
  schedule:
    - cron: "17 4 * * *"   # every day, 07:17 Istanbul time
  workflow_dispatch:        # "Run workflow" button for an immediate refresh

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update_data.py
      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain videos.json metrics.json)" ]; then
            git config user.name "ai2s-bot"
            git config user.email "actions@github.com"
            git add videos.json metrics.json
            git commit -m "Update videos/metrics $(date -u +%F)"
            git push
          fi
